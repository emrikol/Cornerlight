name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install quality tools
        run: brew install swiftformat swiftlint actionlint shellcheck
      - name: Require changelog for product changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            && git merge-base "$BASE_SHA" "$GITHUB_SHA" >/dev/null; then
            ./scripts/check-changelog.sh --range "$BASE_SHA...$GITHUB_SHA"
          fi
      - name: Verify
        run: ./verify.sh
